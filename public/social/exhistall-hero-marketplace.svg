<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title">
  <title id="title">Exhistall virtual exhibition marketplace</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061738" />
      <stop offset="1" stop-color="#12377E" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE36E" />
      <stop offset="1" stop-color="#F7B500" />
    </linearGradient>
    <pattern id="lines" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M0 54 54 0" stroke="#fff" stroke-opacity=".06" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="1600" height="720" fill="url(#sky)" />
  <rect width="1600" height="720" fill="url(#lines)" />
  <circle cx="1320" cy="115" r="240" fill="#fff" opacity=".05" />
  <circle cx="1380" cy="80" r="135" fill="#F7B500" opacity=".13" />
  <g transform="translate(770 120)">
    <path d="M0 196 190 74l190 122v355h-70V270c0-61-50-110-120-110S70 209 70 270v281H0V196Z" fill="#F5F8FF" opacity=".96" />
    <path d="m0 196 190-122 190 122" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round" stroke-width="34" />
    <path d="M100 551V286c0-49 40-89 90-89s90 40 90 89v265" fill="#071D49" />
