    <text x="105" y="335" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800">Exhibit what</text>
    <text x="105" y="415" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800">you do best.</text>
    <text x="105" y="482" font-family="Arial, Helvetica, sans-serif" font-size="27" opacity=".86">A welcoming digital marketplace for businesses,</text>
    <text x="105" y="520" font-family="Arial, Helvetica, sans-serif" font-size="27" opacity=".86">products, services and virtual exhibition halls.</text>
  </g>
